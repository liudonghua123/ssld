[package]
name = "ssld"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "ssld - SSL certificate lifecycle control plane, written in Rust"
authors = ["ssld contributors"]
repository = "https://github.com/liudonghua123/ssld"
homepage = "https://github.com/liudonghua123/ssld"
readme = "README.md"

[[bin]]
name = "ssld"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
x509-parser = "0.16"
rcgen = { version = "0.11", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
futures = "0.3"
time = "0.3"
sha1 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
